name: Bootstrap KelasKita
on:
  push:
    branches: [main]
    paths:
      - 'kelaskita-bootstrap.b64'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract application
        run: |
          base64 -d kelaskita-bootstrap.b64 > /tmp/kelaskita.tgz
          tar -xzf /tmp/kelaskita.tgz -C .
          rm -f kelaskita-bootstrap.b64
          rm -f .github/workflows/bootstrap.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
      - name: Commit application
        run: |
          git config user.name "KelasKita Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: build KelasKita wali kelas app [skip ci]"
          git push
